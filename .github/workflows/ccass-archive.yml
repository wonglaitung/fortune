name: CCASS 日归档（提交到私有数据仓）

# HKEX 许可：仅供个人非商业使用、禁止向第三方再分发。
# 因此本 workflow **只允许推送到私有数据仓**（运行时用 API 校验 private=true），
# 不提交到本仓库、不上传 artifact。数据按日打包成 tar.gz，控制体积。
#
# 需要两个 Secrets：
#   CCASS_DATA_REPO  = <owner>/<private-repo>   （例：yourname/fortune-ccass）
#   CCASS_DATA_TOKEN = fine-grained PAT，仅对该私有仓有 Contents: Read/Write
#
# 体积：压缩后仅存 participant_id/shares/pct + 参与者字典 ⇒ 约 0.4 MB/日（≈100 MB/年）。
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 20:00 HKT
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: '回填最近 N 个周五（0 = 只抓最近交易日）'
        default: '0'
      retry_failed:
        description: '重试已有 .failed 哨兵'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ccass-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Hong_Kong
      CCASS_DATA_REPO: ${{ secrets.CCASS_DATA_REPO }}
      CCASS_DATA_TOKEN: ${{ secrets.CCASS_DATA_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install deps (minimal)
        run: pip install pandas requests beautifulsoup4 lxml

      - name: Verify secrets and private data repo
        run: |
          set -euo pipefail
          if [ -z "${CCASS_DATA_REPO:-}" ] || [ -z "${CCASS_DATA_TOKEN:-}" ]; then
            echo "::error::缺少 CCASS_DATA_REPO / CCASS_DATA_TOKEN secrets"
            exit 1
          fi
          vis=$(curl -fsS -H "Authorization: Bearer $CCASS_DATA_TOKEN" \
                "https://api.github.com/repos/$CCASS_DATA_REPO" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('private'))")
          if [ "$vis" != "True" ]; then
            echo "::error::$CCASS_DATA_REPO 不是私有仓库（private=$vis）——HKEX 数据禁止公开再分发"
            exit 1
          fi

      - name: Fetch CCASS
        run: |
          set -euo pipefail
          ARGS="--workers 4"
          if [ -n "${{ inputs.backfill_weeks }}" ] && [ "${{ inputs.backfill_weeks }}" != "0" ]; then
            ARGS="$ARGS --backfill-weeks ${{ inputs.backfill_weeks }}"
          fi
          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            ARGS="$ARGS --retry-failed"
          fi
          python3 scripts/fetch_ccass.py $ARGS

      - name: Prepare private data repo
        run: |
          set -euo pipefail
          remote="https://x-access-token:${CCASS_DATA_TOKEN}@github.com/${CCASS_DATA_REPO}.git"
          rm -rf ccass-repo
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          set +e
          git ls-remote --exit-code --heads "$remote" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone --depth 1 "$remote" ccass-repo
          elif [ "$rc" -eq 2 ]; then
            echo "数据仓无任何分支（空仓），初始化 main"
            mkdir -p ccass-repo
            git -C ccass-repo init -b main
            git -C ccass-repo remote add origin "$remote"
          else
            echo "::error::无法访问私有数据仓 $CCASS_DATA_REPO（git ls-remote exit=$rc），请检查 CCASS_DATA_TOKEN 的 Contents 权限"
            exit 1
          fi

      - name: Pack and commit
        run: |
          set -euo pipefail
          mkdir -p ccass-repo/data/ccass
          rm -rf ccass-compact
          python3 scripts/compact_ccass.py --src data/ccass --dst ccass-compact
          shopt -s nullglob
          days=(ccass-compact/20*/)
          shopt -u nullglob
          if [ ${#days[@]} -eq 0 ]; then
            echo "::error::没有可归档的日期目录（抓取可能全部失败）"
            exit 1
          fi
          for d in "${days[@]}"; do
            day=$(basename "$d")
            tar -czf "ccass-repo/data/ccass/${day}.tar.gz" -C ccass-compact "$day"
          done
          cp data/ccass/manifest.json ccass-repo/data/ccass/manifest.json
          cd ccass-repo
          git add data/ccass
          if git diff --staged --quiet; then
            echo "无新增归档"
            exit 0
          fi
          git commit -m "ccass: 归档 $(date '+%Y-%m-%d')"
          git push -u origin HEAD

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os

          p = 'data/ccass/manifest.json'
          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          if not os.path.exists(p):
              with open(out, 'a') as f:
                  f.write('manifest 未生成（抓取失败或未运行）\n')
          else:
              m = json.load(open(p))
              lines = ['| 日期 | ok | fail |', '|---|---|---|']
              for d, s in sorted(m.get('dates', {}).items())[-14:]:
                  lines.append(f"| {d} | {s.get('ok', 0)} | {s.get('fail', 0)} |")
              with open(out, 'a') as f:
                  f.write('最近归档：\n\n' + '\n'.join(lines) + '\n')
          PY
