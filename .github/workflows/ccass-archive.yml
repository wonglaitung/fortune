name: CCASS 日归档（提交到私有数据仓）

# HKEX 许可：仅供个人非商业使用、禁止向第三方再分发。
# 因此本 workflow **只允许推送到私有数据仓**（运行时用 API 校验 private=true），
# 不提交到本仓库、不上传 artifact。数据按日打包成 tar.gz，控制体积。
#
# 需要两个 Secrets：
#   CCASS_DATA_REPO  = <owner>/<private-repo>   （例：yourname/fortune-ccass）
#   CCASS_DATA_TOKEN = fine-grained PAT，仅对该私有仓有 Contents: Read/Write
#
# 体积：压缩后仅存 participant_id/shares/pct + 参与者字典 ⇒ 约 0.4 MB/日（≈100 MB/年）。
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 20:00 HKT
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: '回填最近 N 个周五（0 = 只抓最近交易日）'
        default: '0'
      retry_failed:
        description: '重试已有 .failed 哨兵'
        type: boolean
        default: false
      verify_only:
        description: '只验证 secrets（API + git 读写），不抓取/归档'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ccass-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Hong_Kong
      CCASS_DATA_REPO: ${{ secrets.CCASS_DATA_REPO }}
      CCASS_DATA_TOKEN: ${{ secrets.CCASS_DATA_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install deps (minimal)
        run: pip install pandas requests beautifulsoup4 lxml

      - name: Verify secrets (API + git read probe)
        timeout-minutes: 5
        run: |
          set -uo pipefail
          mask() { sed "s|${CCASS_DATA_TOKEN}|***|g"; }
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${CCASS_DATA_REPO:-}" ] || fail "缺少 CCASS_DATA_REPO"
          [ -n "${CCASS_DATA_TOKEN:-}" ] || fail "缺少 CCASS_DATA_TOKEN"
          case "$CCASS_DATA_REPO" in
            *://*|*.git|*' '*|*'\t'*) fail "CCASS_DATA_REPO 格式应为 owner/repo（当前含 URL/.git/空白）";;
            */*/*) fail "CCASS_DATA_REPO 格式应为 owner/repo（层级过多）";;
            */*) ;;
            *) fail "CCASS_DATA_REPO 格式应为 owner/repo";;
          esac
          echo "repo=[$CCASS_DATA_REPO] token_len=${#CCASS_DATA_TOKEN} token_prefix=${CCASS_DATA_TOKEN:0:11}"

          api_code=$(curl -sS -m 20 -o /tmp/ccass_repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $CCASS_DATA_TOKEN" \
            "https://api.github.com/repos/$CCASS_DATA_REPO") || fail "API 请求失败（网络/DNS）"
          echo "api_http=$api_code"
          if [ "$api_code" != "200" ]; then
            echo "::group::API response"
            cat /tmp/ccass_repo.json 2>/dev/null || true
            echo
            echo "::endgroup::"
            fail "API 返回 $api_code（token 无效或对该仓库无访问权）"
          fi
          priv=$(python3 -c "import json;print(json.load(open('/tmp/ccass_repo.json')).get('private'))")
          echo "private=$priv"
          [ "$priv" = "True" ] || fail "$CCASS_DATA_REPO 不是私有仓库（private=$priv）"

          # git smart HTTP 必须用 Basic（Bearer 会 401，不能用来判断 git 权限）
          git_code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            -u "x-access-token:${CCASS_DATA_TOKEN}" \
            "https://github.com/${CCASS_DATA_REPO}.git/info/refs?service=git-upload-pack") || true
          echo "git_http_basic=$git_code"
          case "$git_code" in
            200) ;;
            401|403) fail "git smart HTTP=$git_code：token 对 git 无权限（检查 Contents: Read/Write）";;
            404) fail "git smart HTTP=404：仓库名或权限不对";;
            *) fail "git smart HTTP=$git_code（非预期）";;
          esac

          set +e
          out=$(GIT_TERMINAL_PROMPT=0 timeout 30 git ls-remote --heads \
            "https://x-access-token:${CCASS_DATA_TOKEN}@github.com/${CCASS_DATA_REPO}.git" 2>&1)
          rc=$?
          set -e
          echo "$out" | mask
          echo "git_ls_remote_rc=$rc"
          [ "$rc" -eq 0 ] || fail "git ls-remote 失败 rc=$rc（stderr 见上）"
          if [ -z "$out" ]; then
            echo "git read ok（空仓，无分支；首次运行会初始化 main）"
          else
            echo "git read ok（已有分支）"
          fi

          # 写权限探针：--dry-run 不改变远端，只验证 Contents: Write
          probe=$(mktemp -d)
          git -C "$probe" init -q -b main
          echo probe > "$probe/.probe"
          git -C "$probe" add .probe
          git -C "$probe" -c user.email=ci@example.invalid -c user.name=ci commit -qm probe
          set +e
          perr=$(GIT_TERMINAL_PROMPT=0 timeout 30 git -C "$probe" push --dry-run \
            "https://x-access-token:${CCASS_DATA_TOKEN}@github.com/${CCASS_DATA_REPO}.git" \
            HEAD:refs/heads/__ccass_probe__ 2>&1)
          prc=$?
          set -e
          rm -rf "$probe"
          echo "$perr" | mask
          echo "git_push_dry_run_rc=$prc"
          [ "$prc" -eq 0 ] || fail "写权限探针失败 rc=$prc（检查 Contents: Write）"

      - name: Fetch CCASS
        if: ${{ inputs.verify_only != true }}
        run: |
          set -euo pipefail
          ARGS="--workers 4"
          if [ -n "${{ inputs.backfill_weeks }}" ] && [ "${{ inputs.backfill_weeks }}" != "0" ]; then
            ARGS="$ARGS --backfill-weeks ${{ inputs.backfill_weeks }}"
          fi
          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            ARGS="$ARGS --retry-failed"
          fi
          python3 scripts/fetch_ccass.py $ARGS

      - name: Prepare private data repo
        if: ${{ inputs.verify_only != true }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mask() { sed "s|${CCASS_DATA_TOKEN}|***|g"; }
          remote="https://x-access-token:${CCASS_DATA_TOKEN}@github.com/${CCASS_DATA_REPO}.git"
          rm -rf ccass-repo
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          set +e
          heads=$(GIT_TERMINAL_PROMPT=0 timeout 30 git ls-remote --heads "$remote" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "$heads" | mask
            echo "::error::无法访问私有数据仓 $CCASS_DATA_REPO（git ls-remote exit=$rc）；stderr 见上"
            exit 1
          fi
          if [ -z "$heads" ]; then
            echo "数据仓无任何分支（空仓），初始化 main"
            mkdir -p ccass-repo
            git -C ccass-repo init -b main
            git -C ccass-repo remote add origin "$remote"
          else
            if ! GIT_TERMINAL_PROMPT=0 timeout 120 git clone --depth 1 "$remote" ccass-repo 2>/tmp/ccass_clone.err; then
              mask < /tmp/ccass_clone.err
              echo "::error::clone 失败（数据仓可读但克隆失败）"
              exit 1
            fi
          fi

      - name: Pack and commit
        if: ${{ inputs.verify_only != true }}
        run: |
          set -euo pipefail
          mkdir -p ccass-repo/data/ccass
          rm -rf ccass-compact
          python3 scripts/compact_ccass.py --src data/ccass --dst ccass-compact
          shopt -s nullglob
          days=(ccass-compact/20*/)
          shopt -u nullglob
          if [ ${#days[@]} -eq 0 ]; then
            echo "::error::没有可归档的日期目录（抓取可能全部失败）"
            exit 1
          fi
          for d in "${days[@]}"; do
            day=$(basename "$d")
            tar -czf "ccass-repo/data/ccass/${day}.tar.gz" -C ccass-compact "$day"
          done
          cp data/ccass/manifest.json ccass-repo/data/ccass/manifest.json
          cd ccass-repo
          git add data/ccass
          if git diff --staged --quiet; then
            echo "无新增归档"
            exit 0
          fi
          git commit -m "ccass: 归档 $(date '+%Y-%m-%d')"
          if ! timeout 120 git push -u origin HEAD 2>/tmp/ccass_push.err; then
            sed "s|${CCASS_DATA_TOKEN}|***|g" /tmp/ccass_push.err
            echo "::error::推送失败（检查 token 的 Contents: Write）"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os

          p = 'data/ccass/manifest.json'
          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          if not os.path.exists(p):
              with open(out, 'a') as f:
                  f.write('manifest 未生成（抓取失败或未运行）\n')
          else:
              m = json.load(open(p))
              lines = ['| 日期 | ok | fail |', '|---|---|---|']
              for d, s in sorted(m.get('dates', {}).items())[-14:]:
                  lines.append(f"| {d} | {s.get('ok', 0)} | {s.get('fail', 0)} |")
              with open(out, 'a') as f:
                  f.write('最近归档：\n\n' + '\n'.join(lines) + '\n')
          PY
