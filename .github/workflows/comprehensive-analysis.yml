name: 综合分析邮件提醒

on:
  schedule:
    # 每天港股交易时段执行 (周一到周五)
    # D25（2026-10-13）：8 8 UTC = 16:08 HKT 正落在收市竞价撮合窗口（16:08-16:10），
    #   T 收盘价此刻未定 → 取不到就静默退化成 T-1 特征。改 30 8 = 16:30 HKT，
    #   既保证 EOD 行情落定，又与「T+1 成交」的入场语义自洽（16:10 后当天不再成交）。
    - cron: '30 8 * * 1-5'
  # 允许手动触发，可指定股票代码
  workflow_dispatch:
    inputs:
      stock_codes:
        description: '股票代码（逗号分隔，如 2318.HK,0700.HK）'
        required: false
        default: '2318.HK,0728.HK,1288.HK,3968.HK,1600.HK'
  # D91 临时测试钩子：仅 action-test 分支推送触发（验证后删除分支）
  push:
    branches:
      - action-test

concurrency:
  group: comprehensive-analysis
  cancel-in-progress: false

jobs:
  send-email:
    runs-on: ubuntu-latest
    # D87：日常不训练，正常 60–90 分钟；150 分钟硬上限，避免再次 6 小时静默挂死
    timeout-minutes: 150
    env:
      TZ: Asia/Hong_Kong
      # 日常不再重训：模型由 .github/workflows/monthly-retrain.yml 每月更新
      RETRAIN_MODELS: '0'
      # 2 核 runner 上 n_jobs=-1 会线程争用（AGENTS：可 40x 劣化）
      LGBM_N_JOBS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
          pip install -r requirements.txt

      - name: Run comprehensive analysis script
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL_EXTRA }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_CHAT_URL: ${{ secrets.QWEN_CHAT_URL }}
          QWEN_CHAT_MODEL: ${{ secrets.QWEN_CHAT_MODEL }}
        run: |
          bash scripts/run_comprehensive_analysis.sh "${{ inputs.stock_codes || '2318.HK,0728.HK,1288.HK,3968.HK,1600.HK' }}"

      - name: Commit prediction history
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 先拉取远程更新
          git fetch origin main
          # 如果本地有未提交的更改，先暂存
          if ! git diff --quiet; then
            git stash push -m "Temporarily stash changes before rebase"
          fi
          # 尝试rebase
          if git rebase origin/main; then
            # rebase成功，恢复之前暂存的更改
            if git stash list | grep -q "Temporarily stash changes before rebase"; then
              git stash pop
            fi
          else
            # rebase失败，中止rebase
            git rebase --abort
            # 恢复之前暂存的更改
            if git stash list | grep -q "Temporarily stash changes before rebase"; then
              git stash pop
            fi
            # 使用merge代替rebase
            git merge origin/main -m "Merge remote changes before updating prediction history"
          fi
          # 添加prediction_history.json和每日MD报告
          # data/model_accuracy.json 不入库（.gitignore；每次训练由
          # ml_trading_model.py --mode train 重建，无需跨 run 携带）
          git add data/prediction_history.json
          git add output/comprehensive_reports/*.md
          # SFC 卖空周报增量刷新结果写回仓库，使刷新每周递推（D20 生产纳入配套）
          git add data/sfc_short/ 2>/dev/null || true
          # 检查是否有更改需要提交
          if ! git diff --staged --quiet; then
            git commit -m "Update prediction history and daily report [skip ci]"
            # 推送时处理可能的冲突
            if ! git push; then
              # 推送失败，拉取最新更改
              git pull --rebase origin main
              # 再次尝试推送
              git push
            fi
          else
            echo "没有新的预测历史需要提交"
          fi
