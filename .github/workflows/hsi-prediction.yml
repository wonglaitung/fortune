name: 恒生指数涨跌预测

on:
  schedule:
    # 香港时间周一至周五上午6点运行 (UTC时间 22:00)
    - cron: '0 22 * * 0-4'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  hsi-prediction:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install yfinance pandas numpy
        
    - name: 验证历史预测
      run: |
        python hsi_prediction.py --verify

    - name: 运行恒生指数预测脚本
      env:
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: |
        python hsi_prediction.py

    - name: 刹车滚动验证对账（D35 §十一）
      run: |
        python3 scripts/hsi_risk_overlay_monitor.py --update --report

    - name: 冻结港股行情快照（风险面板数据源，目录不入库）
      continue-on-error: true
      timeout-minutes: 10
      run: |
        python3 scripts/pin_hk_snapshot.py

    - name: 风险面板滚动校准对账（D55/D56）
      continue-on-error: true
      timeout-minutes: 10
      run: |
        python3 scripts/risk_panel_monitor.py --update --report

    - name: 提交预测历史记录 + 刹车对账本 + 风险面板对账本
      if: always()
      run: |
        TODAY=$(date +%F)
        grep -q "^$TODAY," data/risk_panel_ledger.csv 2>/dev/null \
          || echo "::warning::风险面板 ledger 未更新（$TODAY）——检查上两步日志"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/hsi_prediction_history.json || echo "无历史记录更新"
        git add data/hsi_risk_overlay_ledger.csv || echo "无对账本更新"
        git add data/risk_panel_ledger.csv || echo "无风险面板对账本更新"
        git diff --quiet && git diff --staged --quiet || git commit -m "更新恒指预测历史 + 刹车对账本 + 风险面板对账本 [skip ci]"
        git push || echo "无变更需要推送"
