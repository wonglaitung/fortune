name: Tests

on:
  # 手动触发
  workflow_dispatch:
  schedule:
    # 每周日 15:00 CST 跑全量单元测试
    # 故意不设 on:push——避免烧 CI（护栏入库 push 频繁，见 lessons 三.10）
    - cron: '0 7 * * 0'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
